<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>Shadow PC</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0b1020;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }
    #wrap {
      width: 90%;
      max-width: 900px;
      margin: 60px auto;
      background: #141a2e;
      border: 1px solid #26325e;
      border-radius: 10px;
      padding: 24px;
    }
    h1 { margin: 0 0 10px 0; font-size: 34px; }
    p { margin: 8px 0; font-size: 24px; color: #a8b0cc; }
    #status { color: #3ddc97; font-weight: bold; }
    #status.warn { color: #ffcc66; }
    #status.err { color: #ff6b6b; }
    #hint { font-size: 20px; }
    #debug { font-size: 18px; color: #9fb0ff; }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>Shadow PC</h1>
    <p>Connexion en cours à pc.shadow.tech…</p>
    <p id="status">Initialisation…</p>
    <p id="hint">Rouge = retenter • Vert = fallback • Return/Exit = quitter</p>
    <p id="debug">Dernière touche: -</p>
  </div>

  <script>
    (function () {
      var SHADOW_URL = "https://pc.shadow.tech/";
      var FALLBACK_URL = "https://shadow.tech/";
      var TIMEOUT_MS = 10000;

      var statusEl = document.getElementById("status");
      var debugEl = document.getElementById("debug");
      var timeoutId = null;
      var hasNavigated = false;

      function setStatus(msg, cls) {
        statusEl.className = "";
        if (cls) statusEl.className = cls;
        statusEl.innerHTML = msg;
      }

      function safeExit() {
        try {
          if (window.tizen &&
              tizen.application &&
              tizen.application.getCurrentApplication) {
            tizen.application.getCurrentApplication().exit();
            return;
          }
        } catch (e) {}
        try { window.close(); } catch (e2) {}
      }

      function navigate(url) {
        hasNavigated = true;
        window.location.href = url;
      }

      function startFlow() {
        if (timeoutId) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }
        hasNavigated = false;
        setStatus("Ouverture de Shadow PC…", "");

        timeoutId = setTimeout(function () {
          if (hasNavigated) return;
          setStatus("Timeout. Ouverture du fallback…", "warn");
          navigate(FALLBACK_URL);
        }, TIMEOUT_MS);

        navigate(SHADOW_URL);
      }

      // Best effort key registration for Tizen
      try {
        if (window.tizen &&
            tizen.tvinputdevice &&
            tizen.tvinputdevice.registerKeyBatch) {
          tizen.tvinputdevice.registerKeyBatch([
            "ColorF0Red","ColorF1Green","ColorF2Yellow","ColorF3Blue",
            "MediaPlayPause","MediaStop","MediaFastForward","MediaRewind",
            "Return","Exit","Enter"
          ]);
        }
      } catch (e) {}

      document.addEventListener("keydown", function (event) {
        var code = event.keyCode || event.which || 0;
        var key = event.key || "Unknown";
        debugEl.innerHTML = "Dernière touche: " + key + " (code " + code + ")";

        // Return / Back
        if (code === 10009 || key === "Backspace" || key === "BrowserBack") {
          if (event.preventDefault) event.preventDefault();
          setStatus("Fermeture de l’application…", "warn");
          safeExit();
          return;
        }

        // Exit
        if (code === 10182 || key === "Exit") {
          if (event.preventDefault) event.preventDefault();
          safeExit();
          return;
        }

        // Red
        if (code === 403 || key === "ColorF0Red") {
          if (event.preventDefault) event.preventDefault();
          setStatus("Nouvelle tentative vers Shadow PC…", "");
          startFlow();
          return;
        }

        // Green
        if (code === 404 || key === "ColorF1Green") {
          if (event.preventDefault) event.preventDefault();
          setStatus("Ouverture du fallback…", "warn");
          if (timeoutId) clearTimeout(timeoutId);
          navigate(FALLBACK_URL);
          return;
        }
      });

      // Guard: if page becomes visible again without navigation, retry once
      try {
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && !hasNavigated) {
            setStatus("Reprise… nouvelle tentative.", "");
            startFlow();
          }
        });
      } catch (e) {}

      setStatus("Préparation de la connexion…", "");
      startFlow();
    })();
  </script>
</body>
</html>
